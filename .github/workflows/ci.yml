name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build (debug)
        run: swift build -v
      - name: Build (release, universal)
        run: swift build -c release --arch arm64 --arch x86_64
