name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: swift run PS1SimKitTests

      - name: Build app and DMG
        run: scripts/build_app.sh "${{ steps.version.outputs.value }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS1Sim-${{ steps.version.outputs.value }}
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## PS1Sim ${{ steps.version.outputs.value }}

            Download the DMG, drag **PS1Sim** to Applications, then run:

            ```
            xattr -dr com.apple.quarantine /Applications/PS1Sim.app
            ```

            The build is ad-hoc signed rather than notarized, so macOS quarantines
            it on first launch. The command above clears that.

            ### First run
            1. Open **Settings** and press **Download Core** to fetch the
               pcsx_rearmed emulator core.
            2. Add a PlayStation BIOS image you dumped from your own console.
            3. Press **Import Game** and choose a disc image you own
               (`.cue`, `.chd`, `.pbp`, `.m3u`).

            No BIOS or game data is included. You supply both.
